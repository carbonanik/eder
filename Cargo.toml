[package]
name = "eder"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Local-first native PDF library and reader"
license = "MIT"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
rfd = "0.15"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = false
codegen-units = 1
strip = true

[profile.dev]
debug = 1
