name: Release AppImage

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-appimage
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read package version
        id: version
        shell: python
        run: |
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\n")
      - name: Check for an existing release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput('exists', 'true');
              core.info(`Release ${process.env.RELEASE_TAG} already exists; skipping.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }

  release:
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
      RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify an existing tag points to this commit
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already points to another commit. Bump the version in Cargo.toml."
              exit 1
            fi
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev poppler-utils
      - uses: Swatinem/rust-cache@v2
      - name: Download appimagetool
        run: sh packaging/appimage/download-tool.sh
      - name: Build AppImage
        env:
          APPIMAGETOOL: /tmp/appimagetool-x86_64.AppImage
        run: sh packaging/appimage/build.sh
      - name: Create GitHub release and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "target/appimage/eder-$RELEASE_VERSION-x86_64.AppImage" \
            --target "$GITHUB_SHA" \
            --title "Eder $RELEASE_VERSION" \
            --generate-notes
